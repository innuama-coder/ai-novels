<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .title { font-size: 20px; font-weight: 700; fill: #061A3A; }
      .section { font-size: 16px; font-weight: 700; fill: #061A3A; }
      .body { font-size: 14px; font-weight: 450; fill: #344563; }
      .small { font-size: 12px; font-weight: 500; fill: #344563; }
      .tiny { font-size: 11px; font-weight: 450; fill: #72819A; }
      .link { fill: #073B9F; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8FBFF"/>

  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#B8CCEA"/>
  <image href="KUNORA.ai.png" x="30" y="8" width="148" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text class="font small link" x="210" y="39">工作台</text>
  <text class="font small" x="278" y="39">项目</text>
  <text class="font small" x="332" y="39">我的</text>
  <rect x="1118" y="16" width="156" height="32" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
  <text class="font tiny" x="1134" y="37">当前项目：未创建</text>
  <circle cx="1328" cy="32" r="14" fill="#EAF3FF" stroke="#B8CCEA"/>
  <text class="font tiny link" x="1328" y="36" text-anchor="middle">R</text>

  <g transform="translate(24 88)">
    <rect x="0" y="0" width="1392" height="788" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>

    <!-- AI assistant conversation component -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="348" height="788" rx="8" fill="#FFFFFF"/>
      <line x1="348.5" y1="0" x2="348.5" y2="788" stroke="#B8CCEA"/>

      <g transform="translate(20 24)">
        <text class="font section" x="0" y="0">AI 助手</text>
        <text class="font tiny" x="0" y="24">对话、澄清、推进确认</text>
        <circle cx="290" cy="-4" r="5" fill="#36D399"/>
        <text class="font tiny" x="244" y="1">在线</text>
      </g>

      <g transform="translate(20 96)">
        <rect x="0" y="0" width="308" height="72" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
        <text class="font small link" x="16" y="26">AI 助手</text>
        <text class="font body" x="16" y="50">我会先把你的想法整理成可交付需求。</text>

        <rect x="64" y="96" width="244" height="72" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
        <text class="font small link" x="220" y="122">用户</text>
        <text class="font body" x="84" y="146">我想做一个知识型短视频方案。</text>

        <rect x="0" y="192" width="308" height="96" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
        <text class="font small link" x="16" y="218">AI 助手</text>
        <text class="font body" x="16" y="242">好的。我会确认目标受众、交付物、</text>
        <text class="font body" x="16" y="264">内容边界和验收标准。</text>
      </g>

      <g transform="translate(20 612)">
        <rect x="0" y="0" width="308" height="104" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
        <text class="font tiny" x="16" y="28">输入补充信息，或直接修改右侧内容</text>
        <rect x="200" y="58" width="88" height="32" rx="8" fill="#1677FF"/>
        <text class="font small" x="244" y="78" text-anchor="middle" fill="#FFFFFF" font-weight="700">发送</text>
      </g>

      <text class="font tiny" x="20" y="756">AI 对话组件：独立、稳定、贯穿所有工作台页面</text>
    </g>

    <!-- Main workbench surface -->
    <g transform="translate(348 0)">
      <rect x="0" y="0" width="1044" height="788" fill="#F8FBFF"/>

      <g transform="translate(28 24)">
        <rect x="0" y="0" width="900" height="48" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
        <rect x="12" y="10" width="92" height="28" rx="8" fill="#EAF3FF" stroke="#1677FF"/>
        <text class="font small link" x="58" y="29" text-anchor="middle">需求表</text>
        <text class="font small" x="132" y="29">交付物</text>
        <text class="font small" x="204" y="29">日志</text>
        <text class="font tiny" x="742" y="29">Idea 对齐中</text>
      </g>

      <g transform="translate(28 96)">
        <rect x="0" y="0" width="900" height="548" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
        <g transform="translate(28 26)">
          <text class="font section" x="0" y="0" dominant-baseline="hanging">主工作区内容</text>
          <text class="font tiny" x="0" y="30">这里随流程阶段切换，不改变整体布局</text>

          <rect x="0" y="72" width="844" height="64" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
          <text class="font small link" x="20" y="100">对象标题</text>
          <text class="font body" x="20" y="122">展示当前需求、项目、任务或交付物的核心摘要</text>

          <rect x="0" y="156" width="844" height="260" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
          <text class="font small link" x="20" y="188">结构化工作内容</text>
          <line x1="20" y1="216" x2="824" y2="216" stroke="#B8CCEA"/>
          <line x1="20" y1="268" x2="824" y2="268" stroke="#B8CCEA"/>
          <line x1="20" y1="320" x2="824" y2="320" stroke="#B8CCEA"/>
          <text class="font body" x="20" y="250">字段、段落、表格、列表或交付物预览在这里呈现</text>
          <text class="font body" x="20" y="302">用户可查看、编辑、确认，AI 根据内容继续推进</text>

          <rect x="0" y="440" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
          <text class="font small link" x="18" y="468">当前状态</text>
          <text class="font tiny" x="18" y="490">等待用户确认 / AI 处理中</text>

          <rect x="292" y="440" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
          <text class="font small link" x="310" y="468">下一步</text>
          <text class="font tiny" x="310" y="490">继续对齐 / 创建项目 / 查看交付物</text>
        </g>
      </g>

      <!-- Floating information rail -->
      <g transform="translate(958 122)">
        <rect x="0" y="0" width="58" height="520" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
        <rect x="13" y="20" width="32" height="32" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
        <text class="font tiny link" x="29" y="41" text-anchor="middle">信</text>
        <rect x="13" y="68" width="32" height="32" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
        <text class="font tiny link" x="29" y="89" text-anchor="middle">档</text>
        <rect x="13" y="116" width="32" height="32" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
        <text class="font tiny link" x="29" y="137" text-anchor="middle">史</text>
        <line x1="14" y1="176" x2="44" y2="176" stroke="#B8CCEA"/>
        <circle cx="29" cy="220" r="5" fill="#1ED7E6"/>
        <circle cx="29" cy="250" r="5" fill="#FFB020"/>
        <circle cx="29" cy="280" r="5" fill="#36D399"/>
      </g>
    </g>
  </g>
</svg>
