<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #061A3A; }
      .body { font-size: 15px; font-weight: 450; fill: #344563; }
      .small { font-size: 13px; font-weight: 500; fill: #344563; }
      .tiny { font-size: 12px; font-weight: 450; fill: #344563; }
      .link { fill: #073B9F; font-weight: 600; }
      .action { fill: #1677FF; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8FBFF"/>

  <g transform="translate(440 82)">
    <image href="KUNORA.ai.png" x="112" y="-6" width="336" height="124" preserveAspectRatio="xMidYMid meet"/>
    <text class="font title" x="280" y="160" text-anchor="middle">登录鲲工坊</text>
    <text class="font body" x="280" y="194" text-anchor="middle">把想法变成专业成果，从安全登录开始</text>
  </g>

  <g transform="translate(480 310)">
    <rect x="0" y="0" width="480" height="398" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <rect x="24" y="24" width="432" height="350" rx="8" fill="#EAF3FF" stroke="#B8CCEA" stroke-opacity="0.55"/>

    <text class="font body" x="170" y="61">微信扫码登录</text>
    <text class="font tiny" x="142" y="86">新用户扫码后进入信息设置</text>

    <g transform="translate(140 116)">
      <rect x="0" y="0" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
      <rect x="30" y="30" width="36" height="36" rx="5" fill="#061A3A"/>
      <rect x="134" y="30" width="36" height="36" rx="5" fill="#061A3A"/>
      <rect x="30" y="134" width="36" height="36" rx="5" fill="#061A3A"/>
      <rect x="80" y="30" width="12" height="58" rx="2" fill="#073B9F"/>
      <rect x="102" y="30" width="18" height="18" rx="3" fill="#1ED7E6"/>
      <rect x="128" y="83" width="44" height="12" rx="2" fill="#061A3A"/>
      <rect x="82" y="108" width="50" height="18" rx="3" fill="#073B9F"/>
      <rect x="144" y="110" width="26" height="26" rx="4" fill="#FFB020"/>
      <rect x="84" y="146" width="20" height="20" rx="4" fill="#36D399"/>
      <rect x="116" y="150" width="52" height="10" rx="2" fill="#061A3A"/>
      <circle cx="100" cy="100" r="32" fill="#EAF3FF"/>
      <text class="font small link" x="75" y="105">微信</text>
    </g>

    <rect x="112" y="336" width="256" height="46" rx="8" fill="#1677FF"/>
    <text class="font small" x="190" y="365" fill="#FFFFFF" font-weight="700">打开微信扫码</text>
  </g>

  <g transform="translate(480 754)">
    <line x1="0" y1="18" x2="150" y2="18" stroke="#B8CCEA"/>
    <text class="font tiny" x="184" y="22">其他登录方式</text>
    <line x1="330" y1="18" x2="480" y2="18" stroke="#B8CCEA"/>
  </g>

  <g transform="translate(520 792)">
    <rect x="0" y="0" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="18" y="23">支</text>
    <rect x="72" y="0" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="90" y="23">抖</text>
    <rect x="144" y="0" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="162" y="23">快</text>
    <rect x="216" y="0" width="184" height="36" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="281" y="23">手机验证码登录</text>
  </g>

  <text class="font tiny" x="562" y="862">
    <tspan>登录即表示同意 </tspan>
    <tspan class="link">《服务协议》</tspan>
    <tspan> 和 </tspan>
    <tspan class="link">《隐私政策》</tspan>
  </text>

  <text class="font tiny" x="64" y="862">KUNORA.AI 登录页 / 宪法 v6 平面化重构</text>
</svg>
