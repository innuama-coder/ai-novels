<svg width="460" height="900" viewBox="0 0 460 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .title { font-size: 18px; font-weight: 700; fill: #061A3A; }
      .body { font-size: 14px; font-weight: 450; fill: #344563; }
      .small { font-size: 12px; font-weight: 600; fill: #344563; }
      .tiny { font-size: 11px; font-weight: 450; fill: #72819A; }
      .link { fill: #073B9F; font-weight: 700; }
    </style>
  </defs>

  <rect width="460" height="900" fill="#F8FBFF"/>
  <rect x="24" y="24" width="412" height="852" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>

  <g transform="translate(48 52)">
    <text class="font title" x="0" y="0">AI 助手</text>
    <text class="font tiny" x="0" y="24">对话、澄清、提问、整理需求</text>
    <circle cx="344" cy="-4" r="5" fill="#36D399"/>
    <text class="font tiny" x="298" y="1">在线</text>
  </g>

  <g transform="translate(48 112)">
    <rect x="0" y="0" width="364" height="72" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
    <text class="font small link" x="16" y="25">AI 助手</text>
    <text class="font body" x="16" y="50">我会把你的想法整理成可交付需求。</text>

    <rect x="72" y="96" width="292" height="64" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font small link" x="292" y="122">用户</text>
    <text class="font body" x="92" y="145">我想做一个知识型短视频方案。</text>

    <rect x="0" y="184" width="364" height="176" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
    <text class="font small link" x="16" y="210">AI 提问</text>
    <text class="font body" x="16" y="236">你希望这组短视频主要服务哪类目标？</text>
    <rect x="16" y="260" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#1677FF"/>
    <text class="font small link" x="66" y="280" text-anchor="middle">新手入门</text>
    <rect x="128" y="260" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font small" x="178" y="280" text-anchor="middle">进阶提升</text>
    <rect x="240" y="260" width="108" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font small" x="294" y="280" text-anchor="middle">商业转化</text>
    <text class="font tiny" x="16" y="326">选择后，我会自动更新右侧需求表。</text>

    <rect x="0" y="384" width="364" height="150" rx="8" fill="#EAF3FF" stroke="#B8CCEA"/>
    <text class="font small link" x="16" y="410">AI 判断</text>
    <text class="font body" x="16" y="436">你是否已经有参考账号、参考图片或文档？</text>
    <rect x="16" y="464" width="72" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font small" x="52" y="484" text-anchor="middle">没有</text>
    <rect x="100" y="464" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#1677FF"/>
    <text class="font small link" x="156" y="484" text-anchor="middle">有，可上传</text>

    <rect x="72" y="558" width="292" height="84" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font small link" x="292" y="584">用户</text>
    <text class="font body" x="92" y="606">我上传一张参考图和一份文档。</text>
    <rect x="92" y="620" width="92" height="22" rx="6" fill="#EAF3FF" stroke="#B8CCEA"/>
    <text class="font tiny" x="108" y="635">参考图.png</text>
    <rect x="192" y="620" width="98" height="22" rx="6" fill="#EAF3FF" stroke="#B8CCEA"/>
    <text class="font tiny" x="208" y="635">需求说明.docx</text>
  </g>

  <g transform="translate(48 770)">
    <rect x="0" y="0" width="364" height="112" rx="8" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font tiny" x="16" y="28">输入补充信息，或上传图片 / 文档</text>

    <rect x="16" y="52" width="34" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="33" y="72" text-anchor="middle">附</text>
    <rect x="58" y="52" width="34" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="75" y="72" text-anchor="middle">图</text>
    <rect x="100" y="52" width="34" height="32" rx="8" fill="#FFFFFF" stroke="#B8CCEA"/>
    <text class="font tiny link" x="117" y="72" text-anchor="middle">文</text>

    <rect x="220" y="52" width="124" height="32" rx="8" fill="#1677FF"/>
    <text class="font small" x="282" y="72" text-anchor="middle" fill="#FFFFFF" font-weight="700">发送</text>
  </g>

  <text class="font tiny" x="48" y="892">AI 助手组件初稿：支持附件上传与 AI 判断 / 选择提问</text>
</svg>
