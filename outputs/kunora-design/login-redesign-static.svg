  <g transform="translate(868 292)">
    <rect x="0" y="0" width="284" height="284" rx="24" fill="#F8FBFF" stroke="#B8CCEA"/>
    <rect x="24" y="24" width="236" height="236" rx="18" fill="#FFFFFF" stroke="#EAF3FF"/>
    <rect x="56" y="56" width="42" height="42" rx="8" fill="#061A3A"/>
    <rect x="186" y="56" width="42" height="42" rx="8" fill="#061A3A"/>
    <rect x="56" y="186" width="42" height="42" rx="8" fill="#061A3A"/>
    <rect x="118" y="60" width="14" height="70" rx="3" fill="#073B9F"/>
    <rect x="143" y="60" width="22" height="22" rx="4" fill="#1ED7E6"/>
    <rect x="178" y="122" width="54" height="14" rx="3" fill="#061A3A"/>
    <rect x="118" y="154" width="62" height="22" rx="4" fill="#073B9F"/>
    <rect x="194" y="154" width="34" height="34" rx="6" fill="#FFB020"/>
    <rect x="122" y="198" width="24" height="24" rx="4" fill="#36D399"/>
    <rect x="160" y="202" width="68" height="12" rx="3" fill="#061A3A"/>
    <circle cx="142" cy="142" r="38" fill="#EAF3FF"/>
    <text class="font h3 blue" x="108" y="148">微信</text>
  </g>

  <g transform="translate(868 600)">
    <rect x="0" y="0" width="284" height="48" rx="24" fill="#1677FF"/>
    <text class="font h3 white" x="82" y="30">打开微信扫码</text>
  </g>

  <g transform="translate(868 674)">
    <line x1="0" y1="12" x2="84" y2="12" stroke="#B8CCEA" stroke-opacity="0.65"/>
    <text class="font tiny" x="105" y="16">其他登录方式</text>
    <line x1="200" y1="12" x2="284" y2="12" stroke="#B8CCEA" stroke-opacity="0.65"/>
  </g>

  <g transform="translate(890 708)">
    <rect x="0" y="0" width="38" height="38" rx="19" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font tiny blue" x="8" y="24">支</text>
    <rect x="58" y="0" width="38" height="38" rx="19" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font tiny blue" x="66" y="24">抖</text>
    <rect x="116" y="0" width="38" height="38" rx="19" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font tiny blue" x="124" y="24">快</text>
    <rect x="174" y="0" width="88" height="38" rx="19" fill="#F8FBFF" stroke="#B8CCEA"/>
    <text class="font tiny blue" x="196" y="24">手机登录</text>
  </g>

  <text class="font tiny" x="861" y="704">
    <tspan x="861" dy="88">登录即表示同意 </tspan>
    <tspan fill="#073B9F">《服务协议》</tspan>
    <tspan> 和 </tspan>
    <tspan fill="#073B9F">《隐私政策》</tspan>
  </text>

  <g transform="translate(1166 112)">
    <rect x="0" y="0" width="116" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.72" stroke="#EAF3FF"/>
    <circle cx="22" cy="16" r="5" fill="#36D399"/>
