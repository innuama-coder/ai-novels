<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.54" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#F0EDFF"/>
    </linearGradient>
    <linearGradient id="panelGlass" x1="792" y1="126" x2="1228" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#F8FBFF" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="130" y1="132" x2="684" y2="715" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073B9F" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#1ED7E6" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="softShadow" x="752" y="86" width="516" height="714" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#073B9F" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#061A3A" flood-opacity="0.06"/>
    </filter>
    <filter id="quietShadow" x="104" y="100" width="640" height="678" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="32" flood-color="#073B9F" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#B8CCEA" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 56px; line-height: 1.08; font-weight: 760; letter-spacing: 0; fill: #061A3A; }
      .subtitle { font-size: 20px; line-height: 1.55; font-weight: 430; fill: #344563; letter-spacing: 0; }
      .small { font-size: 14px; line-height: 1.4; font-weight: 500; fill: #344563; letter-spacing: 0; }
      .tiny { font-size: 12px; line-height: 1.35; font-weight: 450; fill: #61718A; letter-spacing: 0; }
      .h2 { font-size: 28px; font-weight: 720; fill: #061A3A; letter-spacing: 0; }
      .h3 { font-size: 16px; font-weight: 680; fill: #061A3A; letter-spacing: 0; }
      .blue { fill: #073B9F; }
      .muted { fill: #344563; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#pageBg)"/>
  <rect width="1440" height="900" fill="url(#grid)" opacity="0.55"/>

  <path d="M116 721C275 610 360 476 465 441C593 398 662 476 784 394C875 333 946 214 1068 174" stroke="#1ED7E6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 14" opacity="0.52"/>
  <path d="M126 731C284 621 360 510 478 474C607 435 683 510 810 426C898 368 965 268 1080 218" stroke="#073B9F" stroke-width="3" stroke-linecap="round" opacity="0.13"/>

  <rect x="96" y="92" width="652" height="704" rx="32" fill="url(#blueWash)" filter="url(#quietShadow)"/>
  <rect x="128" y="124" width="588" height="640" rx="26" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.68"/>

  <image href="KUNORA.ai.png" x="176" y="176" width="272" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text class="font title" x="176" y="366">
    <tspan x="176" dy="0">把想法交给</tspan>
    <tspan x="176" dy="64">AI 专家工坊</tspan>
  </text>
  <text class="font subtitle" x="176" y="506">
    <tspan x="176" dy="0">扫码进入后，鲲工坊会从一个 idea 开始，</tspan>
    <tspan x="176" dy="31">帮你完成需求对齐、项目创建和专业交付。</tspan>
  </text>

  <g transform="translate(176 618)">
