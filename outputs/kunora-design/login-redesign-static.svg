    <rect x="296" y="0" width="132" height="42" rx="21" fill="#FFF6DE" stroke="#FFE1A3"/>
    <text class="font small muted" x="320" y="27">无注册入口</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="792" y="126" width="436" height="634" rx="28" fill="url(#panelGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
